XAUUSD:
  role: swing
  timeframes: [daily, 4h, 1h]
  volatility_profile: high
  model_suffix: _xau
  smc_window: 200
  smc_weight: 1.5
  news_weight: 1.4
  csm_currencies: ["USD"]
  movement_threshold: 0.0002
  confidence_thresholds:
    daily: 0.55
    4h: 0.52
    1h: 0.52
  min_coverage_pct: 0.10
  triple_barrier:
    tp_mult: 2.5
    sl_mult: 1.0
    max_hold: 24

EURUSD:
  role: intra_swing
  timeframes: [daily, 4h, 1h]
  volatility_profile: medium
  model_suffix: _eur
  smc_window: 500
  smc_weight: 1.5
  news_weight: 2.0
  csm_currencies: ["EUR", "USD"]
  movement_threshold: 0.0001
  confidence_thresholds:
    daily: 0.47
    4h: 0.52
    1h: 0.52
  min_coverage_pct: 0.15
  triple_barrier:
    tp_mult: 2.0
    sl_mult: 1.0
    max_hold: 24
  model_params:
    xgb:
      n_estimators: 300
      learning_rate: 0.02
      max_depth: 5

GBPUSD:
