XAUUSD:
  role: swing
  timeframes: [daily, 4h, 1h, 15m]
  volatility_profile: high
  model_suffix: _xau
  smc_window: 200
  news_weight: 1.4
  csm_currencies: ["USD"]
  movement_threshold: 0.0002
  confidence_thresholds:
    daily: 0.55
    4h: 0.52
    1h: 0.53
    15m: 0.50

EURUSD:
  role: intra_swing
  timeframes: [daily, 4h, 1h, 15m]
  volatility_profile: medium
  model_suffix: _eur
  smc_window: 500
  news_weight: 1.2
  csm_currencies: ["EUR", "USD"]
  movement_threshold: 0.0001
  confidence_thresholds:
    daily: 0.47
    4h: 0.48
    1h: 0.50
    15m: 0.47
  model_params:
    xgb:
      n_estimators: 300
      learning_rate: 0.02
      max_depth: 5

GBPUSD:
  role: intra_swing
  timeframes: [daily, 4h, 1h, 15m]
  volatility_profile: medium_high
  model_suffix: _gbp
  smc_window: 500
